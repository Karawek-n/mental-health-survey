<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลการสำรวจแนวทางการดูแลทางจิตใจนักศึกษาแพทย์ โดยอาจารย์แพทย์</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts (Inter & Sarabun for Thai) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Interactive Animated Progress Bar Component
        const ProgressBar = ({ label, percentage, count, total, color = "bg-teal-500", subtext }) => (
            <div class="mb-4 group">
                <div class="flex justify-between items-baseline mb-1">
                    <span class="text-sm font-medium text-slate-700 group-hover:text-slate-900 transition-colors">{label}</span>
                    <span class="text-xs font-bold text-slate-900">
                        {percentage}% {count !== undefined && <span class="font-normal text-slate-500">({count}{total ? `/${total}` : ''} คน)</span>}
                    </span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden shadow-inner">
                    <div 
                        class={`h-3 rounded-full transition-all duration-1000 ease-out ${color}`} 
                        style={{ width: `${percentage}%` }}
                    ></div>
                </div>
                {subtext && <p class="text-xs text-slate-500 mt-1 leading-relaxed">{subtext}</p>}
            </div>
        );

        const SurveyResultsApp = () => {
            const [filterRole, setFilterRole] = useState('all'); // 'all', 'student', 'instructor'

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [filterRole]);

            return (
                <div class="max-w-6xl mx-auto px-4 py-8 sm:py-12 animate-fade-in">
                    
                    {/* Header Banner */}
                    <div class="bg-gradient-to-br from-teal-900 via-indigo-900 to-slate-900 rounded-3xl p-6 sm:p-10 text-white shadow-xl mb-8 relative overflow-hidden">
                        <div class="absolute -right-10 -top-10 w-48 h-48 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div class="absolute -left-10 -bottom-10 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        
                        <div class="inline-flex items-center gap-2 bg-teal-500/20 text-teal-200 text-xs sm:text-sm px-4 py-1.5 rounded-full mb-4 backdrop-blur-md border border-teal-400/30">
                            <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                            <span>ขอบคุณที่ให้ความร่วมมือในการตอบแบบสอบถาม</span>
                        </div>
                        
                        <h1 class="text-2xl sm:text-4xl font-extrabold mb-3 leading-tight tracking-tight text-white">
                            ผลการสำรวจแนวทางการดูแลทางจิตใจนักศึกษาแพทย์
                        </h1>
                        <p class="text-slate-300 text-sm sm:text-base max-w-3xl font-light leading-relaxed">
                            สะท้อนมุมมองระหว่าง <span class="font-medium text-teal-300">นักศึกษาแพทย์</span> และ <span class="font-medium text-indigo-300">อาจารย์แพทย์</span> เพื่อนำไปสู่การพัฒนาแนวทางสนับสนุนและระบบดูแลสุขภาพจิตในสถาบันการศึกษา
                        </p>

                        {/* Interactive View Filter Toggle */}
                        <div class="mt-8 flex flex-wrap gap-2 pt-4 border-t border-white/10">
                            <span class="text-xs text-slate-400 self-center mr-2">เลือกมุมมองที่ต้องการเน้น:</span>
                            <button 
                                onClick={() => setFilterRole('all')}
                                class={`px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all ${filterRole === 'all' ? 'bg-white text-slate-900 shadow-md' : 'bg-white/10 hover:bg-white/20 text-white'}`}
                            >
                                <i data-lucide="layout-grid" class="w-3.5 h-3.5 inline mr-1.5"></i> แสดงทั้งหมด
                            </button>
                            <button 
                                onClick={() => setFilterRole('student')}
                                class={`px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all ${filterRole === 'student' ? 'bg-teal-500 text-white shadow-md' : 'bg-white/10 hover:bg-white/20 text-teal-200'}`}
                            >
                                <i data-lucide="graduation-cap" class="w-3.5 h-3.5 inline mr-1.5"></i> เน้นมุมมอง นศพ.
                            </button>
                            <button 
                                onClick={() => setFilterRole('instructor')}
                                class={`px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all ${filterRole === 'instructor' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white/10 hover:bg-white/20 text-indigo-200'}`}
                            >
                                <i data-lucide="stethoscope" class="w-3.5 h-3.5 inline mr-1.5"></i> เน้นมุมมองอาจารย์
                            </button>
                        </div>
                    </div>

                    <section class="mb-12">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="p-2.5 bg-indigo-100 text-indigo-700 rounded-xl">
                                <i data-lucide="users" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h2 class="text-xl sm:text-2xl font-bold text-slate-900"># จำนวนผู้ตอบแบบสอบถาม</h2>
                                <p class="text-xs text-slate-500">จำแนกตามสัดส่วนกลุ่มตัวอย่าง ชั้นปี และประสบการณ์</p>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pb-6 border-b border-slate-100">
                                <div>
                                    <span class="text-xs text-indigo-600 font-bold uppercase tracking-wider">กลุ่มตัวอย่างทั้งหมด</span>
                                    <h3 class="text-3xl font-black text-slate-900 mt-0.5">รวมผู้ตอบแบบสำรวจทั้งหมด 187 คน</h3>
                                </div>
                                <div class="flex items-center gap-3 w-full sm:w-auto">
                                    <div class="flex-1 sm:flex-initial bg-teal-50 border border-teal-100 rounded-2xl p-3 px-5 text-center">
                                        <div class="text-xs text-teal-700 font-medium">นักศึกษาแพทย์</div>
                                        <div class="text-2xl font-bold text-teal-900">104 คน</div>
                                    </div>
                                    <div class="flex-1 sm:flex-initial bg-indigo-50 border border-indigo-100 rounded-2xl p-3 px-5 text-center">
                                        <div class="text-xs text-indigo-700 font-medium">อาจารย์แพทย์</div>
                                        <div class="text-2xl font-bold text-indigo-900">83 คน</div>
                                    </div>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-6">
                                {/* นักศึกษาแพทย์ Breakdown */}
                                {(filterRole === 'all' || filterRole === 'student') && (
                                    <div class="transition-all">
                                        <h4 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                                            <span class="w-3 h-3 rounded-full bg-teal-500"></span>
                                            นักศึกษาแพทย์ (104 คน)
                                        </h4>
                                        <ProgressBar label="ชั้นปีที่ 5" percentage={26.9} count={28} color="bg-teal-500" />
                                        <ProgressBar label="ชั้นปีที่ 4" percentage={20.2} count={21} color="bg-teal-500" />
                                        <ProgressBar label="ชั้นปีที่ 1" percentage={19.2} count={20} color="bg-teal-500" />
                                        <ProgressBar label="ชั้นปีที่ 3" percentage={18.3} count={19} color="bg-teal-500" />
                                        <ProgressBar label="ชั้นปีที่ 2" percentage={7.7} count={8} color="bg-teal-500" />
                                        <ProgressBar label="ชั้นปีที่ 6" percentage={7.7} count={8} color="bg-teal-500" />
                                    </div>
                                )}

                                {/* อาจารย์แพทย์ Breakdown */}
                                {(filterRole === 'all' || filterRole === 'instructor') && (
                                    <div class="transition-all">
                                        <h4 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                                            <span class="w-3 h-3 rounded-full bg-indigo-600"></span>
                                            อาจารย์แพทย์ (83 คน)
                                        </h4>
                                        <ProgressBar label="Young (< 10 ปี)" percentage={41.0} count={34} color="bg-indigo-600" />
                                        <ProgressBar label="Middle (10–20 ปี)" percentage={33.7} count={28} color="bg-indigo-600" />
                                        <ProgressBar label="Senior (> 20 ปี)" percentage={24.1} count={20} color="bg-indigo-600" />
                                        <ProgressBar label="ไม่ระบุ" percentage={1.2} count={1} color="bg-slate-400" />
                                    </div>
                                )}
                            </div>
                        </div>
                    </section>

                    <section class="mb-12">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="p-2.5 bg-amber-100 text-amber-700 rounded-xl">
                                <i data-lucide="heart-pulse" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h2 class="text-xl sm:text-2xl font-bold text-slate-900"># ประสบการณ์ และความกังวล</h2>
                                <p class="text-xs text-slate-500">สะท้อนตัวเลขจริงจากฝั่งนักศึกษาแพทย์และอาจารย์แพทย์</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {/* ฝั่งนักศึกษาแพทย์ */}
                            {(filterRole === 'all' || filterRole === 'student') && (
                                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between">
                                    <div>
                                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                                            <h3 class="text-base font-bold text-slate-900">นักศึกษาแพทย์</h3>
                                            <span class="px-2.5 py-1 bg-teal-100 text-teal-800 text-xs font-bold rounded-md">นศพ.</span>
                                        </div>
                                        
                                        <div class="space-y-4">
                                            <div class="p-4 bg-amber-50 border border-amber-100 rounded-2xl">
                                                <div class="text-xs text-amber-800 font-bold mb-1">การเข้าปรึกษาอาจารย์แพทย์</div>
                                                <p class="text-slate-800 text-xs sm:text-sm leading-relaxed">
                                                    มีนักศึกษาเพียง <span class="font-bold text-amber-900">15.4% (16 คน)</span> เท่านั้นที่เคยตัดสินใจเข้าปรึกษาอาจารย์แพทย์
                                                </p>
                                            </div>

                                            <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl">
                                                <div class="text-xs text-slate-700 font-bold mb-1">คะแนนความสบายใจในการปรึกษา</div>
                                                <p class="text-slate-700 text-xs sm:text-sm mb-2">
                                                    คะแนนความสบายใจของนักศึกษาในการปรึกษาอาจารย์เฉลี่ยอยู่ที่เพียง
                                                </p>
                                                <div class="flex items-baseline gap-2">
                                                    <span class="text-3xl font-black text-slate-900">2.51</span>
                                                    <span class="text-xs text-slate-500">/ 5 คะแนน (ค่ากลาง 2.0)</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ฝั่งอาจารย์แพทย์ */}
                            {(filterRole === 'all' || filterRole === 'instructor') && (
                                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between">
                                    <div>
                                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                                            <h3 class="text-base font-bold text-slate-900">อาจารย์แพทย์</h3>
                                            <span class="px-2.5 py-1 bg-indigo-100 text-indigo-800 text-xs font-bold rounded-md">อาจารย์</span>
                                        </div>

                                        <div class="space-y-4">
                                            <div class="p-4 bg-indigo-50 border border-indigo-100 rounded-2xl">
                                                <div class="text-xs text-indigo-800 font-bold mb-1">ประสบการณ์ในอดีตสมัยเป็น นศพ.</div>
                                                <p class="text-slate-800 text-xs sm:text-sm leading-relaxed">
                                                    อาจารย์แพทย์เพียง <span class="font-bold text-indigo-950">10.8% (9 คน)</span> เท่านั้นที่เคยได้รับการใส่ใจด้านสุขภาพจิตจากอาจารย์แพทย์มาก่อน ในสมัยที่ตนเองเป็นนักศึกษาแพทย์
                                                </p>
                                            </div>

                                            <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl">
                                                <div class="text-xs text-slate-700 font-bold mb-1">ความมั่นใจในการรับมือ / พูดคุย</div>
                                                <p class="text-slate-800 text-xs sm:text-sm mb-1">
                                                    คะแนนความมั่นใจอาจารย์ในการพูดคุย/รับมือ นศพ. อยู่ที่ <span class="font-bold text-slate-900">2.95 จาก 5</span>
                                                </p>
                                                <p class="text-xs text-rose-600 font-medium mt-1">
                                                    * โดยอาจารย์ 30.9% มีความมั่นใจในระดับต่ำ (1-2 คะแนน)
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </section>

                    <section class="mb-12">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="p-2.5 bg-rose-100 text-rose-700 rounded-xl">
                                <i data-lucide="shield-alert" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h2 class="text-xl sm:text-2xl font-bold text-slate-900"># อุปสรรค</h2>
                                <p class="text-xs text-slate-500">ข้อจำกัดและความกังวลใจของทั้งสองฝั่ง</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {/* Student Barriers */}
                            {(filterRole === 'all' || filterRole === 'student') && (
                                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                                    <h3 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center justify-between">
                                        <span>Student Barriers</span>
                                        <span class="text-xs font-semibold px-2 py-0.5 bg-teal-100 text-teal-800 rounded">นศพ.</span>
                                    </h3>
                                    <div class="space-y-4">
                                        <ProgressBar label="กลัวถูกมองว่าอ่อนแอหรือไม่เหมาะสมจะเป็นแพทย์" percentage={53.8} color="bg-rose-500" />
                                        <ProgressBar label='กลัวคำตอบสไตล์ "สอนสั่ง" หรือ "เปรียบเทียบกับยุคอาจารย์"' percentage={48.1} color="bg-rose-500" />
                                        <ProgressBar label="อาจารย์ดูยุ่งมาก ไม่มีเวลา" percentage={47.1} color="bg-rose-500" />
                                        <ProgressBar label="ความไม่มั่นใจเรื่องการรักษาความลับ" percentage={35.6} color="bg-rose-400" />
                                        <ProgressBar label="ความกลัวว่าจะกระทบต่อเกรด/ผลการประเมิน" percentage={23.1} color="bg-rose-400" />
                                    </div>
                                </div>
                            )}

                            {/* Instructor Barriers */}
                            {(filterRole === 'all' || filterRole === 'instructor') && (
                                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                                    <h3 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center justify-between">
                                        <span>Instructor barriers</span>
                                        <span class="text-xs font-semibold px-2 py-0.5 bg-indigo-100 text-indigo-800 rounded">อาจารย์</span>
                                    </h3>
                                    <div class="space-y-4">
                                        <ProgressBar label="1. ไม่รู้วิธีเริ่มทัก หรือกลัวพูดอะไรผิดแล้วทำให้อาการ นศพ. แย่ลง" percentage={51.8} color="bg-indigo-600" />
                                        <ProgressBar label="2. นศพ. ปิดบัง/ไม่ยอมเปิดเผยความรู้สึก" percentage={38.6} color="bg-indigo-600" />
                                        <ProgressBar label="3. ไม่รู้วิธีส่งต่อ หรือระบบช่วยเหลือของคณะฯ ไม่ชัดเจน" percentage={24.1} olor="bg-indigo-500" />
                                        <ProgressBar label="4. ภาระงานอาจารย์เยอะไม่มีเวลา" percentage={20.5} color="bg-indigo-400" />
                                        <ProgressBar label="5. ความกังวลเรื่องเกณฑ์มาตรฐานการเรียนการสอน/วินัย" percentage={20.5} color="bg-indigo-400" />
                                    </div>
                                </div>
                            )}
                        </div>
                    </section>

                    <section class="mb-12">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="p-2.5 bg-teal-100 text-teal-700 rounded-xl">
                                <i data-lucide="sparkles" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h2 class="text-xl sm:text-2xl font-bold text-slate-900"># สิ่งที่ต้องการ</h2>
                                <p class="text-xs text-slate-500">ความคาดหวังและสิ่งที่ต้องการเพิ่มเพื่อพัฒนาการดูแล</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {/* Student Needs */}
                            {(filterRole === 'all' || filterRole === 'student') && (
                                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                                    <h3 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center justify-between">
                                        <span>Student needs</span>
                                        <span class="text-xs font-semibold px-2 py-0.5 bg-teal-100 text-teal-800 rounded">นศพ.</span>
                                    </h3>
                                    <div class="space-y-4">
                                        <ProgressBar label="Psychological Safety ในการทำงาน" percentage={66.3} color="bg-teal-500" />
                                        <ProgressBar label="การถามไถ่สั้นๆ หลังเลิกเรียน/เลิกวอร์ด" percentage={60.6} color="bg-teal-500" />
                                        <ProgressBar label="การรับฟังโดยไม่ตัดสิน" percentage={60.6} color="bg-teal-500" />
                                        <ProgressBar 
                                            label="การสนับสนุนระบบการเข้าถึงการรักษา" 
                                            percentage={32.7} 
                                            color="bg-teal-600" 
                                            subtext="ช่วยอำนวยความสะดวกในการประสานงานพบจิตแพทย์ หรือการลากิจ/ลาป่วยอย่างถูกต้อง"
                                        />
                                    </div>
                                </div>
                            )}

                            {/* Instructor Needs */}
                            {(filterRole === 'all' || filterRole === 'instructor') && (
                                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                                    <h3 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center justify-between">
                                        <span>Instructor needs</span>
                                        <span class="text-xs font-semibold px-2 py-0.5 bg-indigo-100 text-indigo-800 rounded">อาจารย์</span>
                                    </h3>
