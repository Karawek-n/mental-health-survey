<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบสำรวจแนวทางการดูแลทางจิตใจนักศึกษาแพทย์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #334155; }
        h1, h2, h3 { font-family: 'Inter', 'Sarabun', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom Checkbox/Radio */
        .custom-control input:checked + div {
            border-color: #0d9488;
            background-color: #f0fdfa;
        }
        .custom-control input:checked + div .indicator {
            background-color: #0d9488;
            border-color: #0d9488;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // **ตั้งค่า URL ของ Google Apps Script ที่นี่ (ดูวิธีตั้งค่าด้านล่าง)**
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzr8VpsZY4vbG84rWwYfTMFa5-_PYXwUV5kLuyR-tyg2o2udUMNs8iSc2iatG3wx1Gh/exec';

        const QuestionBox = ({ title, children, required = true }) => (
            <div className="mb-8 p-6 bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
                <h3 className="text-lg font-medium text-gray-800 mb-4">{title} {required && <span className="text-red-500">*</span>}</h3>
                {children}
            </div>
        );

        const OptionButton = ({ type, name, value, label, checked, onChange, disabled }) => (
            <label className={`custom-control block cursor-pointer mb-2 ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}>
                <input 
                    type={type} 
                    name={name} 
                    value={value}
                    checked={checked} 
                    onChange={() => onChange(name, value)} 
                    className="hidden"
                    disabled={disabled}
                />
                <div className="flex items-center p-4 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
                    <div className={`indicator w-5 h-5 rounded-${type === 'radio' ? 'full' : 'md'} border-2 border-gray-300 mr-3 flex items-center justify-center transition-colors`}>
                        {checked && type === 'checkbox' && (
                            <svg className="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" /></svg>
                        )}
                        {checked && type === 'radio' && (
                            <div className="w-2 h-2 bg-white rounded-full"></div>
                        )}
                    </div>
                    <span className="text-gray-700 font-medium">{label}</span>
                </div>
            </label>
        );

        const RatingScale = ({ name, currentValue, onChange }) => (
            <div className="flex flex-col sm:flex-row items-center justify-between gap-2 mt-4">
                <span className="text-sm text-gray-500 w-full sm:w-auto text-center sm:text-left">1 = ไม่เห็นด้วย/ไม่มั่นใจเลย</span>
                <div className="flex gap-2">
                    {[1, 2, 3, 4, 5].map(num => (
                        <button
                            key={num}
                            type="button"
                            onClick={() => onChange(name, num)}
                            className={`w-12 h-12 rounded-full flex items-center justify-center text-lg font-medium transition-all ${
                                currentValue === num 
                                ? 'bg-teal-600 text-white shadow-md scale-110' 
                                : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                            }`}
                        >
                            {num}
                        </button>
                    ))}
                </div>
                <span className="text-sm text-gray-500 w-full sm:w-auto text-center sm:text-right">5 = เห็นด้วย/มั่นใจมาก</span>
            </div>
        );

        const TextInput = ({ name, value, onChange, placeholder, isTextarea = false }) => {
            const baseClass = "w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none transition-all resize-none text-gray-700 bg-gray-50 focus:bg-white";
            return isTextarea ? (
                <textarea name={name} value={value} onChange={onChange} placeholder={placeholder} rows="3" className={baseClass} />
            ) : (
                <input type="text" name={name} value={value} onChange={onChange} placeholder={placeholder} className={baseClass} />
            );
        };

        const SurveyApp = () => {
            const [role, setRole] = useState(null); // 'student' | 'instructor'
            const [formData, setFormData] = useState({
                // Student defaults
                student_year: '',
                student_q1: '',
                student_q2: '',
                student_q3: '',
                student_q3_1: [],
                student_q3_1_other: '',
                student_q3_2: '',
                student_q4: [],
                student_q4_other: '',
                student_q5: [],
                student_q5_other: '',
                student_q6: '',
                // Instructor defaults
                instructor_years: '',
                instructor_received_care: '',
                instructor_received_care_how: '',
                instructor_q1: '',
                instructor_q2: '',
                instructor_q3: [],
                instructor_q3_other: '',
                instructor_q4: ''
            });
            const [status, setStatus] = useState('idle'); // idle, submitting, success, error
            const [errorMsg, setErrorMsg] = useState('');

            const handleTextChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleRadioChange = (name, value) => {
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleCheckboxChange = (name, value, maxSelections = null) => {
                setFormData(prev => {
                    const currentSelections = prev[name] || [];
                    if (currentSelections.includes(value)) {
                        return { ...prev, [name]: currentSelections.filter(item => item !== value) };
                    } else {
                        if (maxSelections && currentSelections.length >= maxSelections) {
                            return prev; // Reached max
                        }
                        return { ...prev, [name]: [...currentSelections, value] };
                    }
                });
            };

            const resetForm = () => {
                setRole(null);
                setStatus('idle');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setStatus('submitting');
                
                // Prepare flat payload for Google Sheets
                const payload = {
                    timestamp: new Date().toISOString(),
                    role: role,
                    // Student
                    student_year: formData.student_year,
                    student_q1: formData.student_q1,
                    student_q2: formData.student_q2,
                    student_q3: formData.student_q3,
                    student_q3_1: formData.student_q3_1.join(', ') + (formData.student_q3_1.includes('อื่นๆ') ? ` (${formData.student_q3_1_other})` : ''),
                    student_q3_2: formData.student_q3_2,
                    student_q4: formData.student_q4.join(', ') + (formData.student_q4.includes('อื่นๆ') ? ` (${formData.student_q4_other})` : ''),
                    student_q5: formData.student_q5.join(', ') + (formData.student_q5.includes('อื่นๆ') ? ` (${formData.student_q5_other})` : ''),
                    student_q6: formData.student_q6,
                    // Instructor
                    instructor_years: formData.instructor_years,
                    instructor_received_care: formData.instructor_received_care + (formData.instructor_received_care === 'เคย' ? ` (${formData.instructor_received_care_how})` : ''),
                    instructor_q1: formData.instructor_q1,
                    instructor_q2: formData.instructor_q2,
                    instructor_q3: formData.instructor_q3.join(', ') + (formData.instructor_q3.includes('อื่นๆ') ? ` (${formData.instructor_q3_other})` : ''),
                    instructor_q4: formData.instructor_q4,
                };

                // Remove unselected role data for cleaner sheet
                Object.keys(payload).forEach(key => {
                    if (role === 'student' && key.startsWith('instructor_')) payload[key] = '';
                    if (role === 'instructor' && key.startsWith('student_')) payload[key] = '';
                });

                if(GOOGLE_SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
                    // Simulation mode if URL not set
                    setTimeout(() => {
                        console.log("Simulated Submission Payload:", payload);
                        setStatus('success');
                    }, 1500);
                    return;
                }

                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors', // Required for simple Google Apps Script web apps
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    // Since it's no-cors, we can't read response.ok easily, but if it doesn't throw, it likely succeeded.
                    setStatus('success');
                } catch (err) {
                    console.error("Submission error:", err);
                    setStatus('error');
                    setErrorMsg('เกิดข้อผิดพลาดในการส่งข้อมูล โปรดลองใหม่อีกครั้ง');
                }
            };

            const renderStudentForm = () => (
                <div className="fade-in space-y-2">
                    <QuestionBox title="ชั้นปีที่ท่านศึกษาในขณะนี้">
                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            {[1, 2, 3, 4, 5, 6].map(year => (
                                <OptionButton key={year} type="radio" name="student_year" value={year.toString()} label={`ปี ${year}`} checked={formData.student_year === year.toString()} onChange={handleRadioChange} />
                            ))}
                        </div>
                    </QuestionBox>

                    <h2 className="text-xl font-semibold text-teal-800 mt-8 mb-4 flex items-center gap-2">
                        <span className="bg-teal-100 p-2 rounded-lg"><svg className="w-5 h-5 text-teal-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></span>
                        ตอนที่ 1: ประสบการณ์การได้รับการดูแลทางจิตใจ
                    </h2>

                    <QuestionBox title="1. ท่านเผชิญภาวะวิกฤตทางจิตใจ / ความเครียดสูง / Burnout ระหว่างเรียนแพทย์หรือไม่">
                        <OptionButton type="radio" name="student_q1" value="ไม่เคย" label="ไม่เคย" checked={formData.student_q1 === 'ไม่เคย'} onChange={handleRadioChange} />
                        <OptionButton type="radio" name="student_q1" value="เคย" label="เคย" checked={formData.student_q1 === 'เคย'} onChange={handleRadioChange} />
                    </QuestionBox>

                    <QuestionBox title="2. หากเกิดความไม่สบายใจ ท่านสบายใจในการขอคำปรึกษาด้านสุขภาพจิตกับอาจารย์แพทย์มากน้อยเพียงใด">
                        <RatingScale name="student_q2" currentValue={formData.student_q2} onChange={handleRadioChange} />
                    </QuestionBox>

                    <QuestionBox title="3. ในช่วงที่ศึกษาอยู่คณะแพทย์ มช. ท่านเคยปรึกษาอาจารย์แพทย์เมื่อเผชิญภาวะวิกฤตทางจิตใจ / ความเครียดสูง / Burnout หรือไม่?">
                        <OptionButton type="radio" name="student_q3" value="ไม่เคย" label="ไม่เคย" checked={formData.student_q3 === 'ไม่เคย'} onChange={handleRadioChange} />
                        <OptionButton type="radio" name="student_q3" value="เคย" label="เคย" checked={formData.student_q3 === 'เคย'} onChange={handleRadioChange} />
                    </QuestionBox>

                    {formData.student_q3 === 'เคย' && (
                        <div className="ml-0 sm:ml-6 pl-0 sm:pl-6 sm:border-l-4 border-teal-200 fade-in">
                            <QuestionBox title="3.1 เมื่อ นศพ. ปรึกษาอาจารย์เรื่องความเครียด/สุขภาพจิต ประสบการณ์ส่วนใหญ่ที่พบคืออะไร? (เลือกตอบได้มากกว่า 1 ข้อ)">
                                {[
                                    'อาจารย์รับฟังด้วยความเข้าใจ ไม่ตัดสิน',
                                    'อาจารย์ช่วยปรับเปลี่ยนภาระงาน/ประสานงานช่วยเหลือ',
                                    'อาจารย์ตั้งใจช่วย แต่คำแนะนำอาจยังไม่ตรงจุด (เช่น บอกให้ "อดทน", "สมัยหมอยากกว่านี้")',
                                    'อาจารย์แสดงท่าทีไม่เข้าใจ หรือมองว่าเป็นเรื่องการขาดความรับผิดชอบ',
                                    'อื่นๆ'
                                ].map(opt => (
                                    <div key={opt}>
                                        <OptionButton type="checkbox" name="student_q3_1" value={opt} label={opt} checked={formData.student_q3_1.includes(opt)} onChange={handleCheckboxChange} />
                                        {opt === 'อื่นๆ' && formData.student_q3_1.includes('อื่นๆ') && (
                                            <div className="mt-2 ml-4">
                                                <TextInput name="student_q3_1_other" value={formData.student_q3_1_other} onChange={handleTextChange} placeholder="โปรดระบุ..." />
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </QuestionBox>

                            <QuestionBox title="3.2 สิ่งที่อาจารย์ทำแล้วจะช่วยให้รู้สึกดีขึ้นคืออะไร (เช่น ยกตัวอย่างคำพูด ท่าที หรือน้ำเสียง)">
                                <TextInput name="student_q3_2" value={formData.student_q3_2} onChange={handleTextChange} isTextarea={true} placeholder="อธิบายเพิ่มเติม..." />
                            </QuestionBox>
                        </div>
                    )}

                    <h2 className="text-xl font-semibold text-teal-800 mt-10 mb-4 flex items-center gap-2">
                        <span className="bg-teal-100 p-2 rounded-lg"><svg className="w-5 h-5 text-teal-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg></span>
                        ตอนที่ 2: อุปสรรคในการขอรับคำปรึกษาและสิ่งที่ต้องการจากอาจารย์
                    </h2>

                    <QuestionBox title="4. อะไรคืออุปสรรคสำคัญที่สุดที่อาจทำให้ท่าน ไม่กล้า เปิดใจคุยเรื่องสุขภาพจิตกับอาจารย์? (เลือกได้หลายข้อ)">
                        {[
                            'กลัวกระทบต่อผลการเรียน/เกรด/การประเมิน',
                            'กลัวอาจารย์มองว่าอ่อนแอ หรือไม่เหมาะสมจะเป็นแพทย์',
                            'อาจารย์ดูยุ่งมาก ไม่มีเวลา',
                            'ไม่มั่นใจเรื่องการรักษาความลับ',
                            'กลัวคำตอบสไตล์ "สอนสั่ง" หรือ "เปรียบเทียบกับยุคอาจารย์"',
                            'อื่นๆ'
                        ].map(opt => (
                            <div key={opt}>
                                <OptionButton type="checkbox" name="student_q4" value={opt} label={opt} checked={formData.student_q4.includes(opt)} onChange={handleCheckboxChange} />
                                {opt === 'อื่นๆ' && formData.student_q4.includes('อื่นๆ') && (
                                    <div className="mt-2 ml-4">
                                        <TextInput name="student_q4_other" value={formData.student_q4_other} onChange={handleTextChange} placeholder="โปรดระบุ..." />
                                    </div>
                                )}
                            </div>
                        ))}
                    </QuestionBox>

                    <QuestionBox title="5. สิ่งที่ นศพ. อยากให้อาจารย์แพทย์ทำมากที่สุด เมื่อสัมผัสได้ว่า นศพ.กำลังรู้สึกแย่ (เลือกได้หลายข้อ)">
                        {[
                            'แค่รับฟังอย่างตั้งใจ โดยยังไม่ต้องรีบตัดสินหรือให้คำแนะนำ',
                            'ถามไถ่ด้วยความห่วงใยสั้นๆ หลังเลิกวอร์ด/เลิกเรียน',
                            'ช่วยอำนวยความสะดวกเรื่องการพาไปพบจิตแพทย์/ลากิจป่วย',
                            'ปรับวัฒนธรรมการทำงาน/การ Round งานให้มีความ Psychological Safety มากขึ้น',
                            'อื่นๆ'
                        ].map(opt => (
                            <div key={opt}>
                                <OptionButton type="checkbox" name="student_q5" value={opt} label={opt} checked={formData.student_q5.includes(opt)} onChange={handleCheckboxChange} />
                                {opt === 'อื่นๆ' && formData.student_q5.includes('อื่นๆ') && (
                                    <div className="mt-2 ml-4">
                                        <TextInput name="student_q5_other" value={formData.student_q5_other} onChange={handleTextChange} placeholder="โปรดระบุ..." />
                                    </div>
                                )}
                            </div>
                        ))}
                    </QuestionBox>

                    <QuestionBox title="6. สิ่งที่อยากได้รับจากอาจารย์มากที่สุด ในการดูแลสุขภาพจิตนักศึกษา (ระบุสั้นๆ)">
                        <TextInput name="student_q6" value={formData.student_q6} onChange={handleTextChange} isTextarea={true} placeholder="พิมพ์ข้อความที่นี่..." />
                    </QuestionBox>
                </div>
            );

            const renderInstructorForm = () => (
                <div className="fade-in space-y-2">
                    <QuestionBox title="ท่านเป็นอาจารย์แพทย์มาแล้วกี่ปี">
                        <TextInput name="instructor_years" value={formData.instructor_years} onChange={handleTextChange} placeholder="ระบุจำนวนปี เช่น 5, 10" />
                    </QuestionBox>

                    <QuestionBox title="ในขณะที่ท่านเป็นนักศึกษาแพทย์ท่านเคยได้รับการใส่ใจด้านสุขภาพจิตของท่าน จากอาจารย์แพทย์หรือไม่">
                        <OptionButton type="radio" name="instructor_received_care" value="ไม่เคย" label="ไม่เคย" checked={formData.instructor_received_care === 'ไม่เคย'} onChange={handleRadioChange} />
                        <OptionButton type="radio" name="instructor_received_care" value="เคย" label="เคย" checked={formData.instructor_received_care === 'เคย'} onChange={handleRadioChange} />
                        {formData.instructor_received_care === 'เคย' && (
                            <div className="mt-3 ml-4 pl-4 border-l-2 border-teal-200">
                                <label className="block text-sm text-gray-600 mb-1">อย่างไร (โปรดระบุ)</label>
                                <TextInput name="instructor_received_care_how" value={formData.instructor_received_care_how} onChange={handleTextChange} placeholder="เช่น อาจารย์เรียกไปคุย, ให้คำปรึกษา..." />
                            </div>
                        )}
                    </QuestionBox>

                    <h2 className="text-xl font-semibold text-teal-800 mt-10 mb-4 flex items-center gap-2">
                        <span className="bg-teal-100 p-2 rounded-lg"><svg className="w-5 h-5 text-teal-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg></span>
                        ตอนที่ 1: ประสบการณ์และความมั่นใจ
                    </h2>

                    <QuestionBox title="1. ท่านเคยเจอ นศพ. ที่มีปัญหาสุขภาพจิตหรือความเครียดรุนแรงหรือไม่?">
                        {[
                            'ไม่เคยพบ',
                            'สงสัยว่ามี แต่ไม่แน่ใจและไม่ได้เข้าไปทัก',
                            'เคยพบ และได้เข้าไปคุย/ช่วยเหลือเบื้องต้น',
                            'เคยพบ และส่งต่อผู้เชี่ยวชาญ/จิตแพทย์'
                        ].map(opt => (
                            <OptionButton key={opt} type="radio" name="instructor_q1" value={opt} label={opt} checked={formData.instructor_q1 === opt} onChange={handleRadioChange} />
                        ))}
                    </QuestionBox>

                    <QuestionBox title="2. ท่านมีความมั่นใจแค่ไหนในการรับมือ/พูดคุยกับ นศพ. ที่มีปัญหาสุขภาพจิต?">
                        <RatingScale name="instructor_q2" currentValue={formData.instructor_q2} onChange={handleRadioChange} />
                    </QuestionBox>

                    <h2 className="text-xl font-semibold text-teal-800 mt-10 mb-4 flex items-center gap-2">
                        <span className="bg-teal-100 p-2 rounded-lg"><svg className="w-5 h-5 text-teal-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></span>
                        ตอนที่ 2: อุปสรรคและสิ่งที่อยากรู้
                    </h2>

                    <QuestionBox title="3. ท่านคิดว่า อุปสรรคสำคัญที่สุด ของท่านในการดูแลสุขภาพจิตของ นศพ. คืออะไร? (เลือกได้สูงสุด 2 ข้อ)">
                        <p className="text-sm text-gray-500 mb-3 ml-1">เลือกแล้ว: {formData.instructor_q3.length}/2</p>
                        {[
                            'ภาระงานอาจารย์เยอะมาก ไม่มีเวลาเพียงพอ',
                            'ไม่รู้จะเริ่มทักอย่างไร หรือกลัวพูดอะไรผิดแล้วทำให้อาการ นศพ. แย่ลง',
                            'กังวลเรื่องการรักษามาตรฐานการเรียนการสอน (เกรงว่าการยืดหยุ่นจะทำให้เสียวินัย)',
                            'ไม่รู้วิธีการส่งต่อ หรือระบบช่วยเหลือของคณะฯ ไม่ชัดเจน',
                            'นศพ. ปิดบัง ไม่ยอมเปิดเผยความรู้สึก',
                            'อื่นๆ'
                        ].map(opt => {
                            const isChecked = formData.instructor_q3.includes(opt);
                            const maxReached = formData.instructor_q3.length >= 2 && !isChecked;
                            
                            return (
                                <div key={opt}>
                                    <OptionButton 
                                        type="checkbox" 
                                        name="instructor_q3" 
                                        value={opt} 
                                        label={opt} 
                                        checked={isChecked} 
                                        onChange={(n, v) => handleCheckboxChange(n, v, 2)} 
                                        disabled={maxReached}
                                    />
                                    {opt === 'อื่นๆ' && isChecked && (
                                        <div className="mt-2 ml-4">
                                            <TextInput name="instructor_q3_other" value={formData.instructor_q3_other} onChange={handleTextChange} placeholder="โปรดระบุ..." />
                                        </div>
                                    )}
                                </div>
                            )
                        })}
                    </QuestionBox>

                    <QuestionBox title="4. ข้อมูลที่ท่านอยากทราบมากที่สุด เพื่อให้ดูแลสุขภาพจิตนักศึกษาได้ง่ายขึ้น">
                        <TextInput name="instructor_q4" value={formData.instructor_q4} onChange={handleTextChange} isTextarea={true} placeholder="ระบุสิ่งที่ท่านต้องการเรียนรู้เพิ่มเติม..." />
                    </QuestionBox>
                </div>
            );

            return (
                <div className="min-h-screen py-10 px-4 sm:px-6">
                    <div className="max-w-3xl mx-auto">
                        
                        {/* Header */}
                        <div className="text-center mb-10">
                            <h1 className="text-3xl sm:text-4xl font-bold text-teal-900 mb-3 tracking-tight">แบบสำรวจแนวทางการดูแลทางจิตใจนักศึกษาแพทย์<br/><span className="text-xl sm:text-2xl text-teal-700">โดยอาจารย์แพทย์ (ไม่ใช่จิตแพทย์)</span></h1>
                            <p className="text-gray-500">สำหรับนักศึกษาแพทย์และอาจารย์แพทย์</p>
                        </div>

                        {/* Status Views */}
                        {status === 'success' && (
                            <div className="bg-teal-50 border border-teal-200 rounded-2xl p-10 text-center fade-in shadow-sm">
                                <div className="w-20 h-20 bg-teal-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <svg className="w-10 h-10 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>
                                </div>
                                <h2 className="text-2xl font-bold text-teal-900 mb-2">ขอบคุณสำหรับข้อมูล</h2>
                                <p className="text-teal-700 mb-8">ข้อมูลของท่านจะนำไปสู่การพัฒนาแนวทางการดูแลที่ดียิ่งขึ้น</p>
                                <button onClick={resetForm} className="px-6 py-3 bg-white text-teal-700 font-medium rounded-xl border border-teal-200 hover:bg-teal-50 transition-colors shadow-sm">
                                    กลับไปหน้าแรก
                                </button>
                            </div>
                        )}

                        {status !== 'success' && (
                            <form onSubmit={handleSubmit} className="space-y-8">
                                
                                {/* Role Selection */}
                                {!role ? (
                                    <div className="bg-white p-8 sm:p-10 rounded-3xl border border-gray-100 shadow-sm fade-in">
                                        <h3 className="text-xl text-center font-medium text-gray-800 mb-8">กรุณาเลือกสถานะของท่าน</h3>
                                        <div className="grid sm:grid-cols-2 gap-4">
                                            <button type="button" onClick={() => setRole('student')} className="flex flex-col items-center justify-center p-8 rounded-2xl border-2 border-gray-100 hover:border-teal-500 hover:bg-teal-50 transition-all group">
                                                <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                                    <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-5-9-5-9 5 9 5z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222" /></svg>
                                                </div>
                                                <span className="text-lg font-semibold text-gray-800">นักศึกษาแพทย์</span>
                                            </button>
                                            
                                            <button type="button" onClick={() => setRole('instructor')} className="flex flex-col items-center justify-center p-8 rounded-2xl border-2 border-gray-100 hover:border-teal-500 hover:bg-teal-50 transition-all group">
                                                <div className="w-16 h-16 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                                    <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                                                </div>
                                                <span className="text-lg font-semibold text-gray-800">อาจารย์แพทย์</span>
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    /* Dynamic Form based on Role */
                                    <div className="fade-in">
                                        <button type="button" onClick={() => setRole(null)} className="mb-6 flex items-center text-gray-500 hover:text-teal-600 transition-colors text-sm font-medium">
                                            <svg className="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                                            ย้อนกลับเพื่อเปลี่ยนสถานะ
                                        </button>
                                        
                                        <div className="bg-white rounded-3xl p-6 sm:p-10 shadow-sm border border-gray-100">
                                            {role === 'student' ? renderStudentForm() : renderInstructorForm()}

                                            {errorMsg && (
                                                <div className="mt-6 p-4 bg-red-50 text-red-700 rounded-xl flex items-center">
                                                    <svg className="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                                    {errorMsg}
                                                </div>
                                            )}

                                            <div className="mt-10 pt-6 border-t border-gray-100 flex justify-end">
                                                <button 
                                                    type="submit" 
                                                    disabled={status === 'submitting'}
                                                    className={`px-8 py-4 rounded-xl text-white font-medium text-lg flex items-center transition-all ${
                                                        status === 'submitting' ? 'bg-gray-400 cursor-not-allowed' : 'bg-teal-600 hover:bg-teal-700 shadow-md hover:shadow-lg transform hover:-translate-y-0.5'
                                                    }`}
                                                >
                                                    {status === 'submitting' ? (
                                                        <><svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>กำลังบันทึกข้อมูล...</>
                                                    ) : (
                                                        <>ส่งแบบสอบถาม <svg className="w-5 h-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg></>
                                                    )}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </form>
                        )}
                        
                        <div className="text-center mt-12 text-sm text-gray-500 pb-10 bg-gray-50 p-4 rounded-xl border border-gray-100">
                            <p className="font-medium">ข้อมูลนี้จะถูกใช้เพื่อพัฒนาการดูแลนักศึกษาแพทย์ต่อไป</p>
                            <p className="mt-1">ไม่มีการบันทึก และเผยแพร่ตัวตนของผู้ตอบแบบสอบถามนี้</p>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SurveyApp />);
    </script>
</body>
</html>
